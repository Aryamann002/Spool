<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="none">
  <filter id="fine-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="8" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.5" intercept="0.25" />
      <feFuncG type="linear" slope="0.5" intercept="0.25" />
      <feFuncB type="linear" slope="0.5" intercept="0.25" />
      <feFuncA type="table" tableValues="0.018 0.035" />
    </feComponentTransfer>
  </filter>
  <filter id="paper-fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.7" numOctaves="2" seed="17" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.5" intercept="0.25" />
      <feFuncG type="linear" slope="0.5" intercept="0.25" />
      <feFuncB type="linear" slope="0.5" intercept="0.25" />
      <feFuncA type="table" tableValues="0.012 0.025" />
    </feComponentTransfer>
  </filter>
  <rect width="1600" height="1200" filter="url(#fine-grain)" />
  <rect width="1600" height="1200" filter="url(#paper-fibers)" />
</svg>
